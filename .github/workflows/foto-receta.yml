name: Cambiar la foto de una receta
on:
  workflow_dispatch:
    inputs:
      receta:
        description: "Receta (id o parte del título, p. ej. minestrone)"
        required: true
      consulta:
        description: "Búsqueda en inglés (opcional, p. ej. minestrone bean soup)"
        required: false
concurrency: { group: expandir, cancel-in-progress: false }
permissions: { contents: write, pages: write }
jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar y elegir foto
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          RECETA: ${{ inputs.receta }}
          CONSULTA: ${{ inputs.consulta }}
        run: node scripts/foto-receta.mjs
      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "gemini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js recetas/historial.json recetas/indice.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Foto nueva: ${{ inputs.receta }}"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
