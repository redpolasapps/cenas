name: Expandir recetas con Gemini

on:
  push:
    branches: [main]
    paths: ["plan/**"]
  workflow_dispatch:
    inputs:
      forzar:
        description: "Volver a generar aunque data.js ya esté hecho con este plan"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: expandir
  cancel-in-progress: false

jobs:
  expandir:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Redactar recetas (Gemini) y montar data.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FORZAR: ${{ inputs.forzar && '1' || '' }}
        run: node scripts/expandir.mjs

      - name: Validar
        run: |
          node -e "global.window={};require('./data.js');const d=window.MENU_DATA;if(!d.hoy.cenas.length)throw new Error('sin cenas');console.log('data.js OK', d.hoy.fecha, d.hoy.cenas.length,'cenas')"
          node -e "JSON.parse(require('fs').readFileSync('recetas/historial.json'));console.log('historial OK')"

      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "gemini-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js recetas/historial.json recetas/indice.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Recetas redactadas por Gemini $(date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          # Los push hechos con GITHUB_TOKEN no siempre lanzan GitHub Pages: lo pedimos a mano
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
