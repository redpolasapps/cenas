<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cenas en casa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cenas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE; --card:#FFFFFF; --ink:#2E2A26; --soft:#7A6F64; --line:#EDE4D6;
  --terra:#D9735A; --terra-d:#B85A43; --verde:#6BA368; --ambar:#E8B04B; --crema:#F5EBDD;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Nunito",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:17px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
.wrap{max-width:1100px;margin:0 auto;padding:22px 24px 120px}

/* Cabecera */
.top{display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:18px}
.top .dia{font-size:15px;color:var(--soft);font-weight:700}
.top h1{font-size:34px;margin-top:2px}
.top .hora{font-family:"Fraunces",Georgia,serif;font-size:40px;color:var(--terra)}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;padding:8px 0 14px;z-index:5}
.tab{display:block;width:128px;text-align:center;padding:8px 0;border-radius:14px;color:var(--soft);font-weight:700;font-size:15px;margin:0 6px}
.tab .ic{display:block;font-size:24px;line-height:30px}
.tab.on{background:var(--crema);color:var(--terra-d)}

/* Cole */
.cole{background:var(--crema);border-radius:22px;padding:18px 22px;margin-bottom:22px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.cole svg{width:62px;height:62px;-webkit-flex:none;flex:none;margin-right:18px}
.cole .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--terra-d);font-weight:800}
.cole .platos{font-size:18px;font-weight:700;margin:4px 0 6px;line-height:1.35}
.cole .platos span{color:var(--soft);font-weight:600}
.cole .tip{font-size:15px;color:var(--soft);line-height:1.4}

.info{background:#fff;border:2px dashed var(--line);border-radius:22px;padding:16px 20px;margin:10px 0;font-size:15px;line-height:1.5;color:var(--soft)}
.info .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--terra-d);font-weight:800;margin-bottom:4px}
.info b{color:var(--ink)}
.expl{background:#E4F0DF;border-radius:22px;padding:18px 22px;margin:6px 0 10px;font-size:16.5px;line-height:1.5}
.expl .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#3F7A3A;font-weight:800;margin-bottom:4px}
.sec{font-size:24px;margin:6px 0 14px}

/* Tarjetas */
.grid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -9px}
.card{width:33.333%;padding:0 9px 18px}
.card-in{cursor:pointer;background:var(--card);border-radius:22px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(80,50,20,.06);overflow:hidden;height:100%;display:block;width:100%;text-align:left}
.hero{height:190px;position:relative;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.hero .dish svg{width:170px;height:170px;display:block}
.hero,.det-img{overflow:hidden}
.foto{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.credito{position:absolute;left:10px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:10px}
.sinfoto .credito{display:none}
.badge{z-index:2;position:absolute;right:12px;bottom:10px;width:54px;height:54px;background:#fff;border-radius:50%;padding:2px}
.badge svg{width:50px;height:50px;display:block}
.coc{z-index:2;position:absolute;left:14px;bottom:14px;background:#fff;border:2px solid;border-radius:10px;padding:5px 11px 5px 8px;font-weight:800;font-size:14px;letter-spacing:.01em;white-space:nowrap;box-shadow:0 3px 0 rgba(80,50,20,.10),0 6px 14px rgba(80,50,20,.12);-webkit-transform:rotate(-4deg);transform:rotate(-4deg)}
.coc .ce{font-size:17px;margin-right:6px;vertical-align:-2px}
.det-img .coc{left:12px;bottom:14px;font-size:15px}
.credito{left:auto!important;bottom:auto!important;top:12px;right:14px;z-index:2;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{z-index:2;position:absolute;top:12px;left:14px;background:#fff;border-radius:20px;padding:3px 11px;font-weight:800;font-size:14px;color:var(--terra-d)}
.body{padding:14px 18px 18px}
.peq{display:inline-block;background:#FFF1C9;color:#8A5A00;font-weight:800;font-size:13px;padding:3px 10px;border-radius:12px;margin-bottom:8px}
.like{position:absolute;top:10px;right:12px;font-size:22px;line-height:44px;width:44px;height:44px;border-radius:22px;background:#fff;text-align:center;box-shadow:0 2px 0 var(--line)}
.like.on{background:#FDE7EA}
.likeg{position:static;display:inline-block;font-size:28px;width:56px;height:56px;line-height:56px;border-radius:28px;vertical-align:middle;margin-left:10px}
.body{position:relative}
.body h3{padding-right:46px}
.peq.hea{background:#DDF1E4;color:#256B3C}
.peq + .peq{margin-left:6px}
.peq.gou{background:#EFE3F7;color:#6B3F8A}
.body h3{font-size:21px;line-height:1.2}
.body .sub{color:var(--soft);font-size:15px;margin-top:3px}
.meta{margin-top:10px;font-size:14px;color:var(--soft);font-weight:700}
.meta b{color:var(--ink)}
.meta i{font-style:normal;margin-right:12px}
.por{margin-top:10px;font-size:14.5px;line-height:1.4}
.tags{margin-top:10px}
.tag{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:12px;background:var(--crema);color:var(--terra-d);margin:0 5px 5px 0}

.leyenda{font-size:13px;color:var(--soft);margin:-4px 0 16px;font-weight:600}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:5px;margin:0 5px 0 12px;vertical-align:0}

/* Finde */
.bloque{margin-bottom:12px}
.bloque h2{font-size:22px;margin-bottom:12px}
.bloque h2 span{font-family:"Nunito",sans-serif;font-size:14px;font-weight:800;color:var(--terra-d);text-transform:uppercase;letter-spacing:.08em;margin-left:8px}
.grid2 .card{width:50%}
.mini .hero{height:150px}
.mini .hero .dish svg{width:130px;height:130px}

/* Compra */
.compra{background:#fff;border-radius:22px;box-shadow:0 2px 0 var(--line)}
.compra{padding:0 18px;margin-bottom:10px}
.chead{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;width:100%;text-align:left;padding:10px 0}
.cmini{width:54px;height:54px;-webkit-flex:none;flex:none;margin-right:14px}
.cmini svg{width:54px;height:54px;display:block}
.ctit{-webkit-flex:1;flex:1;font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:700}
.cet{display:block;font-family:"Nunito",sans-serif;font-size:12.5px;font-weight:800;color:var(--terra-d);text-transform:uppercase;letter-spacing:.06em}
.ccnt{font-weight:800;color:var(--soft);font-size:15px;margin:0 12px}
.flecha{font-size:28px;color:var(--soft);-webkit-transition:-webkit-transform .2s;transition:transform .2s}
.abierta .flecha{-webkit-transform:rotate(90deg);transform:rotate(90deg)}
.citems{display:none;padding-bottom:8px;border-top:1px solid var(--line)}
.abierta .citems{display:block}
.item{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:17px;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid #D8CBB7;margin-right:14px;-webkit-flex:none;flex:none;text-align:center;line-height:24px;color:#fff;font-weight:800}
.item.ok{color:#B4A898;text-decoration:line-through}
.item.ok .check{background:var(--verde);border-color:var(--verde)}

/* Detalle receta */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.ov.on{display:block}
.barra{position:-webkit-sticky;position:sticky;top:0;z-index:3;background:rgba(251,246,238,.96);border-bottom:1px solid var(--line);display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;padding:12px 24px}
.bbig{background:#fff;box-shadow:0 2px 0 var(--line),0 4px 14px rgba(80,50,20,.08);border-radius:16px;padding:14px 22px;font-size:19px;font-weight:800;color:var(--terra-d);min-width:130px}
.bbig:active{background:var(--crema)}
.bbig.home{color:var(--ink)}
.det{max-width:860px;margin:0 auto;padding:20px 24px 60px}
.back{font-weight:800;color:var(--terra-d);font-size:17px;padding:10px 0}
.det-top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin:8px 0 20px}
.det-img{position:relative;width:220px;height:220px;-webkit-flex:none;flex:none;margin-right:28px;border-radius:30px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.det-img .dish svg{width:190px;height:190px;display:block}
.det-img .badge{right:10px;bottom:10px;width:70px;height:70px}
.det-img .badge svg{width:66px;height:66px}
.det-top h1{font-size:32px;line-height:1.15}
.ingr{background:#fff;border-radius:22px;padding:6px 22px 12px;box-shadow:0 2px 0 var(--line)}
.btn{display:block;width:100%;background:var(--terra);color:#fff;font-weight:800;font-size:20px;padding:18px;border-radius:18px;margin-top:18px;text-align:center}
.btn:active{background:var(--terra-d)}
.btn2{display:block;text-align:center;margin-top:12px;color:var(--terra-d);font-weight:800;text-decoration:none;padding:10px}

/* Modo cocina */
.cook{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:20;display:none}
.cook.on{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.cook-h{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;padding:16px 24px}
.cook-h .t{font-family:"Fraunces",Georgia,serif;font-size:19px;color:var(--soft);text-align:center;padding:0 12px}
.x{font-size:16px;font-weight:800;color:var(--terra-d);padding:8px 4px}
.dots{text-align:center;padding:0 0 4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;background:var(--line);margin:0 4px}
.dot.on{background:var(--terra);width:26px}
.cook-b{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:10px 40px;text-align:center}
.ilu{width:240px;height:240px;background:var(--crema);border-radius:50%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;margin-bottom:24px}
.ilu svg{width:170px;height:170px}
.pn{font-size:15px;font-weight:800;color:var(--terra-d);text-transform:uppercase;letter-spacing:.1em}
.pt{font-size:28px;line-height:1.3;font-weight:700;max-width:720px;margin-top:8px}
.pt.largo{font-size:22px}
.usa{margin-top:14px}
.usa span{display:inline-block;background:#E4F0DF;color:#2F5E2B;font-weight:800;font-size:15px;padding:5px 12px;border-radius:14px;margin:0 6px 6px 0}
.cons{margin-top:10px;background:#FFF6DC;color:#6B5200;border-radius:14px;padding:10px 14px;font-size:16px;line-height:1.4;max-width:720px;text-align:left}
.lpasos{background:#fff;border-radius:22px;padding:14px 22px 14px 48px;box-shadow:0 2px 0 var(--line);margin:0}
.lpasos li{padding:10px 0;border-bottom:1px solid var(--line);font-size:16.5px;line-height:1.45}
.lpasos li:last-child{border-bottom:0}
.lpasos .usa{margin-top:8px}.lpasos .usa span{font-size:13px}
.lpasos .cons{font-size:14.5px}
.cook-b{overflow-y:auto;-webkit-overflow-scrolling:touch}
.timer{margin-top:22px;background:var(--crema);color:var(--terra-d);font-weight:800;font-size:20px;padding:14px 26px;border-radius:30px}
.timer.run{background:var(--terra);color:#fff}
.timer.done{background:var(--verde);color:#fff}
.cook-f{display:-webkit-flex;display:flex;padding:16px 24px 26px}
.nav{-webkit-flex:1;flex:1;padding:22px;border-radius:20px;font-size:21px;font-weight:800}
.nav.prev{background:var(--crema);color:var(--soft);margin-right:14px;-webkit-flex:0 0 32%;flex:0 0 32%}
.nav.next{background:var(--terra);color:#fff}
.nav[disabled]{opacity:.35}

.pie{font-size:13px;color:#B4A898;text-align:center;margin-top:20px}

.mesnav{text-align:center;margin:0 0 14px}
.mbtn{width:48px;height:48px;border-radius:24px;background:#fff;box-shadow:0 2px 0 var(--line);font-size:26px;color:var(--terra-d);font-weight:800;vertical-align:middle}
.mtit{display:inline-block;min-width:220px;font-family:"Fraunces",Georgia,serif;font-size:24px;font-weight:700;vertical-align:middle}
.cal{background:#fff;border-radius:22px;padding:8px;box-shadow:0 2px 0 var(--line)}
.crow{display:-webkit-flex;display:flex}
.crow>div{width:20%;-webkit-flex:1 1 0;flex:1 1 0;margin:4px;min-width:0}
.chd>div{text-align:center;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--terra-d);padding:6px 0}
.cday{background:var(--bg);border-radius:14px;padding:8px 9px 10px;font-size:12.5px;line-height:1.3}
.cday.fuera{background:transparent;opacity:.35}
.cday.libre .cpl{color:#B4A898}
.cday.hoy{background:#FCE6DC;box-shadow:inset 0 0 0 3px var(--terra)}
.cnum{font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:700;margin-bottom:4px}
.cnum .cwd{display:none;font-style:normal}
.cnum span{font-family:"Nunito",sans-serif;font-size:11px;background:var(--terra);color:#fff;border-radius:8px;padding:1px 7px;vertical-align:3px}
.cnota{font-size:11px;font-weight:800;color:var(--terra-d);margin-bottom:3px}
.cpl{margin-bottom:3px;color:var(--soft)}
.cpl.c1{color:var(--ink);font-weight:700}
.buscar{display:block;width:100%;font-family:inherit;font-size:18px;padding:14px 18px;border-radius:16px;border:2px solid var(--line);background:#fff;margin:0 0 12px;-webkit-appearance:none}
.chips{margin-bottom:8px;white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.chip{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:18px;padding:7px 14px;font-weight:800;font-size:14px;color:var(--soft);margin:0 6px 6px 0}
.chip.on{background:var(--terra);border-color:var(--terra);color:#fff}
.cuenta{font-size:14px;color:var(--soft);font-weight:700;margin:8px 0 10px}
.ult{font-size:13px;color:var(--terra-d);font-weight:800;margin-top:6px}
.semnav{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;margin:0 0 10px;font-weight:800;color:var(--soft);font-size:15px}
.sbtn{width:40px;height:40px;border-radius:20px;background:#fff;box-shadow:0 2px 0 var(--line);font-size:22px;color:var(--terra-d);font-weight:800}
.tira{display:-webkit-flex;display:flex;margin:0 -3px 14px}
.tdia{-webkit-flex:1;flex:1;margin:0 3px;background:#fff;border-radius:16px;padding:8px 0 7px;box-shadow:0 2px 0 var(--line);text-align:center;position:relative}
.tdia .tl{display:block;font-size:12px;font-weight:800;color:var(--soft)}
.tdia .tn{display:block;font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:700;line-height:26px}
.tdia .th{display:block;font-size:10px;font-weight:800;color:var(--terra);text-transform:uppercase}
.tdia.libre{opacity:.45}
.tdia.fuera{opacity:.3}
.tdia.on{background:var(--terra);box-shadow:none}
.tdia.on .tl,.tdia.on .tn,.tdia.on .th{color:#fff}
.dcard{background:#fff;border-radius:22px;padding:18px 18px 8px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(80,50,20,.06)}
.dtit{font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:700;margin-bottom:10px}
.dhoy{font-family:"Nunito",sans-serif;font-size:12px;background:var(--terra);color:#fff;border-radius:8px;padding:2px 8px;vertical-align:4px}
.dnota{background:#FFF6DC;color:#6B5200;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;margin-bottom:10px}
.dpl{display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.dpl .di{font-size:26px;width:42px;-webkit-flex:none;flex:none;line-height:30px}
.dpl .dl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--terra-d)}
.dpl .dp{font-size:17px;font-weight:700;line-height:1.3;margin-top:2px}
.vacio{text-align:center;color:var(--soft);padding:50px 20px;font-size:18px;line-height:1.5}
@media (max-width:900px){ .card{width:50%} }
@media (max-width:600px){
  .wrap{padding:16px 14px 110px}
  .tab{width:auto;-webkit-flex:1;flex:1;margin:0 2px;font-size:11px;padding:6px 0}
  .tab .ic{font-size:21px;line-height:26px}
  .top{-webkit-align-items:center;align-items:center}
  .top .hora{font-size:26px}
  .top .bbig{padding:9px 11px;min-width:0;font-size:14px;margin-right:8px!important}
  .mtit{min-width:150px;font-size:20px}
  .cole svg{display:none}
  .det-img{margin:0 auto 16px}
  .barra{padding:10px 14px}.bbig{min-width:0;padding:12px 16px;font-size:17px}
  .cook-h{padding:12px 14px}.cook-h .t{display:none}
  .ilu{width:150px;height:150px;margin-bottom:14px}.ilu svg{width:110px;height:110px}
  .cook-b{padding:10px 18px;-webkit-justify-content:flex-start;justify-content:flex-start}
  .cook-f{padding:12px 14px 20px}
  .nav{padding:18px;font-size:18px}
  .expl,.info{font-size:15px}
 .card,.grid2 .card{width:100%} .top h1{font-size:28px} .det-top{display:block} .pt{font-size:23px} }
@media (max-height:700px){ .ilu{width:170px;height:170px} .ilu svg{width:120px;height:120px} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="tabs" id="tabs">
  <button class="tab" data-v="hoy"><span class="ic">🍽️</span>Cena de hoy</button>
  <button class="tab" data-v="finde"><span class="ic">☀️</span>Fin de semana</button>
  <button class="tab" data-v="compra"><span class="ic">🛒</span>Compra</button>
  <button class="tab" data-v="cole"><span class="ic">📅</span>Menú cole</button>
  <button class="tab" data-v="recetario"><span class="ic">📖</span>Recetario</button>
</div>

<div class="ov" id="ov"></div>
<div class="cook" id="cook"></div>

<script src="platos.js"></script>
<script>document.write('<script src="data.js?v='+new Date().getTime()+'"><\/script>');</script>
<script>
(function(){
  var D = window.MENU_DATA || {};
  var vista = 'hoy';
  var RECETAS = {};
  var cookR = null, cookI = 0, tInt = null, tLeft = 0;

  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var COCINA = {'Española':'🥘','Mediterránea':'🍋','Italiana':'🍝','Japonesa':'🍜','Asiática':'🥢','Americana':'🍔','Mexicana':'🌮','Árabe':'🥙','Casera':'🏠'};

  /* ---------- Plato equilibrado (SVG) ---------- */
  function arc(cx,cy,r,a0,a1,color){
    var x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    var large=(a1-a0)>Math.PI?1:0;
    return '<path d="M'+cx+' '+cy+' L'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+' Z" fill="'+color+'"/>';
  }
  function plato(p){
    p = p || {verdura:50,proteina:25,hidratos:25};
    var tot=(p.verdura||0)+(p.proteina||0)+(p.hidratos||0)||1;
    var parts=[[p.verdura,'#7DB56F'],[p.proteina,'#E07F63'],[p.hidratos,'#EDBB57']];
    var a=-Math.PI/2, s='';
    for(var i=0;i<parts.length;i++){
      var d=(parts[i][0]/tot)*Math.PI*2;
      if(d>0){ s+=arc(70,70,40,a,a+d,parts[i][1]); a+=d; }
    }
    return '<svg viewBox="0 0 140 140"><ellipse cx="70" cy="76" rx="62" ry="60" fill="rgba(80,50,20,.10)"/>'+
      '<circle cx="70" cy="70" r="62" fill="#fff"/><circle cx="70" cy="70" r="50" fill="#FAF6F0" stroke="#EFE6D8" stroke-width="2"/>'+
      s+'<circle cx="70" cy="70" r="40" fill="none" stroke="#fff" stroke-width="3"/>'+
      '<line x1="70" y1="30" x2="70" y2="70" stroke="#fff" stroke-width="3"/></svg>';
  }

  function cargaMes(k){
    if(MENUS[k]!==undefined) return;
    MENUS[k] = 'cargando';
    try{
      var x = new XMLHttpRequest();
      x.open('GET','menus/'+k+'.json?v='+new Date().getTime(),true);
      x.onreadystatechange = function(){
        if(x.readyState!==4) return;

      };

  var diaSel = null;

  function kdia(d){ return ym(d)+'-'+(d.getDate()<10?'0':'')+d.getDate(); }
  var DCORTO = ['D','L','M','X','J','V','S'];
  function etiquetaPlato(p, j, n){
    if(j===0) return ['🥣','Primero'];
    if(j===1) return ['🍽️','Segundo'];

  function coleMovil(dias, hk){
    // Días lectivos del mes visible (lunes a viernes)
    var lista = [], d = new Date(mesVista.getFullYear(), mesVista.getMonth(), 1);

    var claves = lista.map(kdia);
    if(!diaSel || claves.indexOf(diaSel)<0){

    }
    var sel = new Date(diaSel+'T12:00:00');

    var lunes = new Date(sel.getFullYear(), sel.getMonth(), sel.getDate()-((sel.getDay()+6)%7));
    var s = '<div class="semnav"><button class="sbtn" data-sem="-1">‹</button><span>Semana del '+lunes.getDate()+' de '+MESES[lunes.getMonth()]+'</span><button class="sbtn" data-sem="1">›</button></div>';
    s += '<div class="tira">';

  function vCole(){
    var hoy = new Date();
    if(!mesVista) mesVista = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    var k = ym(mesVista); cargaMes(k);
    var m = MENUS[k];
    var titulo = MESES[mesVista.getMonth()].charAt(0).toUpperCase()+MESES[mesVista.getMonth()].slice(1)+' '+mesVista.getFullYear();

    // retroceder al lunes
    var dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow);
    var finMes = new Date(mesVista.getFullYear(), mesVista.getMonth()+1, 0);
    while(d <= finMes){
      var fila = '', alguno = false;
      for(var i=0;i<5;i++){
        var dd = new Date(d.getFullYear(), d.getMonth(), d.getDate()+i);
        var dentro = dd.getMonth()===mesVista.getMonth();
        var key = ym(dd)+'-'+(dd.getDate()<10?'0':'')+dd.getDate();
        var info = dentro ? dias[key] : null;
        if(dentro) alguno = true;
        fila += '<div class="cday'+(dentro?'':' fuera')+(key===hk?' hoy':'')+(info?'':' libre')+'">'+
          '<div class="cnum"><i class="cwd">'+DIAS[dd.getDay()]+' </i>'+dd.getDate()+(key===hk?' <span>Hoy</span>':'')+'</div>'+
          (info && info.nota ? '<div class="cnota">'+esc(info.nota)+'</div>' : '')+
          (info ? (info.platos||[]).map(function(p,j){ return '<div class="cpl'+(j===0?' c1':'')+'">'+esc(p)+'</div>'; }).join('') : (dentro?'<div class="cpl">—</div>':''))+
          '</div>';
      }
      if(alguno) s += '<div class="crow">'+fila+'</div>';
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate()+7);
    }
    s += '</div>';
    if(m.notas) s += '<div class="pie" style="text-align:left">'+esc(m.notas)+'</div>';
    return s;
  }

  /* ---------- Recetario ---------- */
  var HIST, FIL = {q:'', cocina:'', tipo:''};
  function vRecetario(){
    var s = cabecera('Recetario', 'Todas las recetas que ha propuesto el agente');
    if(HIST===undefined){ HIST='cargando'; cargaJSON('recetas/historial.json', function(d){ HIST = d && d.recetas ? d.recetas : []; if(vista==='recetario') render(); }); }
    if(HIST==='cargando') return s+'<div class="vacio">Cargando recetario…</div>';
    s += '<input id="q" class="buscar" type="search" placeholder="🔍 Buscar por nombre o ingrediente…" value="'+esc(FIL.q)+'" autocomplete="off">';
    s += '<div class="chips">';
    [['','Todas'],['fav','❤️ Favoritas'],['peques','🧒 Peques'],['healthy','💪 Healthy'],['gourmet','✨ Capricho'],['cena','🌙 Cenas'],['finde','☀️ Finde']].forEach(function(t){
      s += '<button class="chip'+(FIL.tipo===t[0]?' on':'')+'" data-ft="'+t[0]+'">'+t[1]+'</button>';
    });
    s += '</div><div class="chips"><button class="chip'+(FIL.cocina===''?' on':'')+'" data-fc="">Todas las cocinas</button>';
    for(var c in COCINA){ if(COCINA.hasOwnProperty(c)) s += '<button class="chip'+(FIL.cocina===c?' on':'')+'" data-fc="'+esc(c)+'">'+COCINA[c]+' '+esc(c)+'</button>'; }
    s += '</div><div id="resu">'+resultados()+'</div>';
    return s;
  }
  function norm(t){ t=String(t||'').toLowerCase(); var a='áàäâéèëêíìïîóòöôúùüûñç', b='aaaaeeeeiiiioooouuuunc'; for(var i=0;i<a.length;i++) t=t.split(a.charAt(i)).join(b.charAt(i)); return t; }
  function ultima(r){ return (r.usos||[]).map(function(u){return u.fecha;}).sort().pop()||''; }
  function resultados(){
    if(!HIST || !HIST.length) return '<div class="vacio">Todavía no hay recetas guardadas.</div>';
    var q = norm(FIL.q), out = [];
    HIST.forEach(function(r){
      var usos = r.usos||[];
      if(FIL.cocina && r.cocina!==FIL.cocina) return;
      if(FIL.tipo==='fav' && !esFav(r.id)) return;
      if(FIL.tipo==='peques' && !r.peques) return;
      if(FIL.tipo==='gourmet' && !r.gourmet) return;
      if(FIL.tipo==='healthy' && !r.healthy) return;
      if(FIL.tipo==='cena' && !usos.some(function(u){return u.dia==='Entre semana';})) return;
      if(FIL.tipo==='finde' && !usos.some(function(u){return u.dia!=='Entre semana';})) return;
      if(q){ var txt = norm(r.titulo+' '+(r.subtitulo||'')+' '+(r.cocina||'')+' '+(r.etiquetas||[]).join(' ')+' '+(r.ingredientes||[]).join(' ')); if(txt.indexOf(q)<0) return; }
      out.push(r);
    });
    out.sort(function(a,b){
      var fa=esFav(a.id)?1:0, fb=esFav(b.id)?1:0; if(fa!==fb) return fb-fa;
      var ua=ultima(a), ub=ultima(b); return ua<ub?1:ua>ub?-1:0;
    });
    if(!out.length) return '<div class="vacio">No hay recetas con ese filtro.</div>';
    var s = '<div class="cuenta">'+out.length+' receta'+(out.length===1?'':'s')+'</div><div class="grid">';
    out.forEach(function(r,i){
      var c = card(r, 0, HEROBG[i%HEROBG.length], true), u=ultima(r);
      if(u){ var d=new Date(u+'T12:00:00'), n=(r.usos||[]).length; c = c.replace('<div class="meta">','<div class="ult">Última vez: '+d.getDate()+' de '+MESES[d.getMonth()]+(n>1?' · '+n+' veces':'')+'</div><div class="meta">'); }
      s += c;
    });
    return s+'</div>';
  }
  function pintaResultados(){ var r=$('resu'); if(r) r.innerHTML = resultados(); }

  function render(){
    RECETAS = {};
    // Registrar todas las recetas para poder abrirlas desde cualquier vista
    ((D.hoy||{}).cenas||[]).forEach(function(r){ RECETAS[r.id]=r; });
    ((D.finde||{}).comidas||[]).forEach(function(b){ (b.opciones||[]).forEach(function(r){ RECETAS[r.id]=r; }); });
    var html = vista==='finde' ? vFinde() : vista==='compra' ? vCompra() : vista==='cole' ? vCole() : vista==='recetario' ? vRecetario() : vHoy();
    html += '<div class="pie">Actualizado: '+esc(fechaLarga((D.actualizado||'').slice(0,10)))+'</div>';
    $('app').innerHTML = html;
    var qi = $('q');
    if(qi){ var hq = function(){ if(FIL.q!==qi.value){ FIL.q = qi.value; pintaResultados(); } }; qi.oninput = hq; qi.onkeyup = hq; }
    var tabs = document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++) tabs[i].className = 'tab'+(tabs[i].getAttribute('data-v')===vista?' on':'');
    window.scrollTo(0,0);
  }

  /* ---------- Detalle ---------- */
  function abrir(id){
    var r = RECETAS[id]; if(!r) return;
    var s = '<div class="barra"><button class="bbig" id="cerrar">‹ Volver</button><button class="bbig home" data-home="1">🏠 Inicio</button></div><div class="det">'+
      '<div class="det-top"><div class="det-img" style="background:'+(r._bg||'#FCE6DC')+'">'+dish(r)+badge(r)+cocina(r)+'</div><div><h1>'+esc(r.titulo)+corazon(r.id,true)+'</h1>'+
      '<div class="meta" style="font-size:16px"><i>⏱ <b>'+esc(r.tiempo)+' min</b></i><i>👩‍🍳 <b>'+esc(r.dificultad)+'</b></i><i>🍽 <b>'+esc(r.raciones)+' raciones</b></i></div>'+
      (r.porque?'<div class="por" style="font-size:16px">'+esc(r.porque)+'</div>':'')+(r.truco?'<div class="por" style="font-size:16px">🧒 <b>Para el peque:</b> '+esc(r.truco)+'</div>':'')+'</div></div>'+
      '<h2 class="sec">Ingredientes</h2><div class="ingr">';
    (r.ingredientes||[]).forEach(function(it){ s += '<div class="item"><span class="check" style="border-color:#7DB56F"></span>'+esc(it)+'</div>'; });
    s += '</div><button class="btn" id="empezar">Empezar a cocinar paso a paso ›</button>';
    s += '<h2 class="sec" style="margin-top:26px">Pasos</h2><ol class="lpasos">';
    (r.pasos||[]).forEach(function(p){
      s += '<li><div>'+esc(p.texto)+'</div>'+
        (p.usa&&p.usa.length?'<div class="usa">'+p.usa.map(function(u){return '<span>'+esc(u)+'</span>';}).join('')+'</div>':'')+
        (p.consejo?'<div class="cons">💡 '+esc(p.consejo)+'</div>':'')+'</li>';
    });
    s += '</ol>';
    if(r.fotosUrl) s += '<a class="btn2" href="'+esc(r.fotosUrl)+'" target="_blank" rel="noopener">📷 Ver la receta con fotos reales</a>';
    s += '</div>';
    var ov = $('ov'); ov.innerHTML = s; ov.className='ov on'; ov.scrollTop=0;
    $('cerrar').onclick = function(){ ov.className='ov'; };
    $('empezar').onclick = function(){ cocinar(r); };
  }

  /* ---------- Modo cocina ---------- */
  function paraTimer(){ if(tInt){ clearInterval(tInt); tInt=null; } }
  function fmt(sec){ var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
  function cocinar(r){ cookR=r; cookI=0; paraTimer(); pintaPaso(); $('cook').className='cook on'; }
  function pintaPaso(){
    var r=cookR, p=r.pasos[cookI], n=r.pasos.length, dots='';
    for(var i=0;i<n;i++) dots+='<span class="dot'+(i===cookI?' on':'')+'"></span>';
    var last = cookI===n-1;
    $('cook').innerHTML =
      '<div class="cook-h"><button class="bbig" id="salir">✕ Salir</button><span class="t">'+esc(r.titulo)+'</span><button class="bbig home" data-home="1">🏠 Inicio</button></div>'+
      '<div class="dots">'+dots+'</div>'+
      '<div class="cook-b"><div class="ilu">'+icon(p.icono)+'</div>'+
      '<div class="pn">Paso '+(cookI+1)+' de '+n+(p.fuego?' · 🔥 Fuego '+esc(p.fuego):'')+'</div><div class="pt'+(String(p.texto).length>150?' largo':'')+'">'+esc(p.texto)+'</div>'+
      (p.usa&&p.usa.length?'<div class="usa">'+p.usa.map(function(u){return '<span>'+esc(u)+'</span>';}).join('')+'</div>':'')+
      (p.consejo?'<div class="cons">💡 '+esc(p.consejo)+'</div>':'')+
      (p.min?'<button class="timer" id="timer">⏱ Temporizador '+p.min+' min</button>':'')+'</div>'+
      '<div class="cook-f"><button class="nav prev" id="prev"'+(cookI===0?' disabled':'')+'>‹ Atrás</button>'+
      '<button class="nav next" id="next">'+(last?'¡Listo! A la mesa 🎉':'Siguiente ›')+'</button></div>';
    $('salir').onclick=function(){ paraTimer(); $('cook').className='cook'; };
    $('prev').onclick=function(){ if(cookI>0){ paraTimer(); cookI--; pintaPaso(); } };
    $('next').onclick=function(){ paraTimer(); if(last){ $('cook').className='cook'; $('ov').className='ov'; } else { cookI++; pintaPaso(); } };
    if(p.min) $('timer').onclick=function(){
      var b=this;
      if(tInt){ paraTimer(); b.className='timer'; b.innerHTML='⏱ Temporizador '+p.min+' min'; return; }
      tLeft=p.min*60; b.className='timer run'; b.innerHTML='⏳ '+fmt(tLeft)+' · tocar para parar';
      tInt=setInterval(function(){
        tLeft--;
        if(tLeft<=0){ paraTimer(); b.className='timer done'; b.innerHTML='✅ ¡Tiempo!'; return; }
        b.innerHTML='⏳ '+fmt(tLeft)+' · tocar para parar';
      },1000);
    };
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', function(e){
    var t = e.target;
    while(t && t!==document){
      if(t.getAttribute){
        if(t.getAttribute('data-like')){
          var lid=t.getAttribute('data-like'), nf=!esFav(lid);
          store('fav_'+lid, nf?'1':'0');
          var bs=document.querySelectorAll('[data-like="'+lid+'"]');
          for(var j=0;j<bs.length;j++){ bs[j].className=bs[j].className.replace(' on','')+(nf?' on':''); bs[j].innerHTML=nf?'❤️':'🤍'; }
          return;
        }
        if(t.getAttribute('data-ft')!==null){ FIL.tipo=t.getAttribute('data-ft'); render(); return; }
        if(t.getAttribute('data-fc')!==null){ FIL.cocina=t.getAttribute('data-fc'); render(); return; }
        if(t.getAttribute('data-home')){ paraTimer(); $('cook').className='cook'; $('ov').className='ov'; ir('hoy'); return; }
        if(t.getAttribute('data-r')){ abrir(t.getAttribute('data-r')); return; }
        if(t.getAttribute('data-v')){ ir(t.getAttribute('data-v')); return; }
        if(t.getAttribute('data-dsel')){
          var nk=t.getAttribute('data-dsel'), nd=new Date(nk+'T12:00:00');
          if(nd.getMonth()!==mesVista.getMonth()) mesVista=new Date(nd.getFullYear(), nd.getMonth(), 1);
          diaSel=nk; render(); return;
        }
        if(t.getAttribute('data-sem')){
          var sd=new Date(diaSel+'T12:00:00'); sd.setDate(sd.getDate()+7*parseInt(t.getAttribute('data-sem'),10));
          if(sd.getDay()===0) sd.setDate(sd.getDate()-2); if(sd.getDay()===6) sd.setDate(sd.getDate()-1);
          if(sd.getMonth()!==mesVista.getMonth()) mesVista=new Date(sd.getFullYear(), sd.getMonth(), 1);
          diaSel=kdia(sd); render(); return;
        }
        if(t.getAttribute('data-m')){
          var md=parseInt(t.getAttribute('data-m'),10);
          mesVista=new Date(mesVista.getFullYear(), mesVista.getMonth()+md, 1); diaSel=null; render(); return;
        }
        if(t.getAttribute('data-t')){
          var id=t.getAttribute('data-t'), box=$('cb_'+id), op=box.className.indexOf('abierta')<0;
          box.className='compra'+(op?' abierta':''); store('a_'+id, op?'1':'0'); return;
        }
        if(t.getAttribute('data-k')){
          var k=t.getAttribute('data-k'), ok=store(k)==='1';
          store(k, ok?'0':'1');
          t.className='item'+(ok?'':' ok');
          t.firstChild.innerHTML = ok?'':'✓';
          var bx=t.parentNode.parentNode, cnt=bx.querySelector?bx.querySelector('.ccnt'):null;
          if(cnt){ var all=bx.querySelectorAll('.item'), n=0; for(var j=0;j<all.length;j++) if(all[j].className.indexOf('ok')>=0) n++; cnt.innerHTML=n+'/'+all.length; }
          return;
        }
      }
      t = t.parentNode;
    }
  });

  function ir(v){
    vista = v;
    try{ if(location.hash!=='#'+v) location.hash = v; }catch(e){}
    render();
  }
  function desdeHash(){
    var h=(location.hash||'').replace('#','');
    vista = (h==='finde'||h==='compra'||h==='cole'||h==='recetario') ? h : 'hoy';
    render();
  }
  window.addEventListener('hashchange', desdeHash);
  var eraMovil = esMovil();
  window.addEventListener('resize', function(){ var em=esMovil(); if(em!==eraMovil){ eraMovil=em; if(vista==='cole') render(); } });

  // Reloj, y recarga automática de datos cada 30 min (si no se está cocinando)
  setInterval(function(){ var h=$('hora'); if(h) h.innerHTML=hora(); }, 20000);
  setInterval(function(){
    if($('cook').className.indexOf('on')<0 && $('ov').className.indexOf('on')<0 && location.protocol.indexOf('http')===0){
      location.reload();
    }
  }, 30*60*1000);

  desdeHash();
})();
</script>
</body>
